name: Compress Images

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/photos/**"
      - "assets/thumbnails/**"
      - "assets/images/**"
    branches:
      - main

jobs:
  compress:
    name: Compress Images
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip compress]')"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Compress images and generate WebP
        run: |
          node << 'JSEOF'
          const sharp = require("sharp");
          const fs    = require("fs");
          const path  = require("path");

          async function processDir(dir, generateWebP) {
            if (!fs.existsSync(dir)) { console.log("Skip (not found):", dir); return; }
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const fp  = path.join(dir, e.name);
              if (e.isDirectory()) { await processDir(fp, generateWebP); continue; }
              const ext = e.name.toLowerCase().match(/\.(jpe?g|png)$/);
              if (!ext) continue;

              const orig = fs.readFileSync(fp);

              // Compress original
              try {
                let out;
                if (ext[1] === "png")
                  out = await sharp(orig).png({ quality: 85, compressionLevel: 9 }).toBuffer();
                else
                  out = await sharp(orig).jpeg({ quality: 82, progressive: true, mozjpeg: true }).toBuffer();

                if (out.length < orig.length) {
                  const pct = ((1 - out.length / orig.length) * 100).toFixed(1);
                  fs.writeFileSync(fp, out);
                  console.log("Compressed:", fp, "(" + pct + "% smaller)");
                } else {
                  console.log("Already optimal:", fp);
                }
              } catch (err) {
                console.error("Error compressing:", fp, err.message);
              }

              // Generate WebP version alongside original
              if (generateWebP && ext[1] !== "png") {
                const webpPath = fp.replace(/\.(jpe?g)$/i, ".webp");
                try {
                  const webpBuf = await sharp(orig).webp({ quality: 82 }).toBuffer();
                  const origSize = orig.length;
                  if (webpBuf.length < origSize) {
                    fs.writeFileSync(webpPath, webpBuf);
                    const pct = ((1 - webpBuf.length / origSize) * 100).toFixed(1);
                    console.log("WebP created:", webpPath, "(" + pct + "% vs JPEG)");
                  } else {
                    console.log("WebP not smaller, skipping:", webpPath);
                  }
                } catch (err) {
                  console.error("Error generating WebP:", webpPath, err.message);
                }
              }
            }
          }

          (async () => {
            await processDir("assets/photos", false);
            await processDir("assets/thumbnails", false);
            await processDir("assets/images", true);
            console.log("Done.");
          })();
          'JSEOF'

      - name: Commit compressed images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/photos/ assets/thumbnails/ assets/images/
          if git diff --staged --quiet; then
            echo "No images needed compression."
          else
            git commit -m "Auto-compress images and generate WebP [skip compress]"
            git push
          fi
