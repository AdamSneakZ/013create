  <div class="contact-wrap">
    <h1>Contact.</h1>
    <p class="contact-tagline">Bespoke Media Production for Automotive &amp; Luxury Brands.</p>

    <!--
      FORM SETUP — Formspree (free, 50 submissions/month):
      1. Go to https://formspree.io/register — create a free account
      2. Click "New Form", name it "013Create Contact"
      3. Copy your form ID (e.g. xabcdefg)
      4. Replace YOUR_FORMSPREE_ID below with your actual ID
    -->
    <form
      class="contact-form"
      id="contactForm"
      action="https://formspree.io/f/mwvypkvy"
      method="POST"
    >
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" name="service">
            <option value="" disabled selected>Select service</option>
            <option value="Photography">Photography</option>
            <option value="Videography">Videography</option>
            <option value="Photo &amp; Video">Photo &amp; Video</option>
          </select>
        </div>
        <div class="form-group">
          <label for="project">Project Type</label>
          <select id="project" name="project_type">
            <option value="" disabled selected>Select type</option>
            <option value="Automotive">Automotive</option>
            <option value="Hotel &amp; Interiors">Hotel &amp; Interiors</option>
            <option value="Food &amp; Beverage">Food &amp; Beverage</option>
            <option value="Events">Events</option>
            <option value="Portrait &amp; Fashion">Portrait &amp; Fashion</option>
            <option value="Sports">Sports</option>
            <option value="Brand Film">Brand Film</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" required placeholder="Tell us about your project..."></textarea>
      </div>

      <input type="text" name="_gotcha" style="display:none">
      <input type="hidden" name="_subject" value="New enquiry — 013Create website">

      <button type="submit" class="btn-submit">Send Message</button>
      <p class="form-note">A member of the team will be in contact soon.</p>
    </form>
  </div>
